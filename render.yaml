services:
  - type: web
    name: work-marketplace-websocket
    runtime: node
    plan: free
    region: singapore # or frankfurt, oregon
    rootDir: work-marketplace/backend
    buildCommand: npm install
    startCommand: node websocket-server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
